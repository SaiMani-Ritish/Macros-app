<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Macros</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #18181b;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #10b981; /* Emerald Green for Nutritionix feel */
            --border: #27272a;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8vh 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            transition: all 0.5s ease;
        }

        /* Search Bar */
        .search-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 3rem;
        }

        input[type="text"] {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 22px 28px;
            padding-right: 120px; /* Space for the enter hint */
            border-radius: 24px;
            color: var(--text);
            font-size: 1.25rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        .enter-hint {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            background: #27272a;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
            border: 1px solid #3f3f46;
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .results-grid.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .food-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .food-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
            opacity: 0.6;
        }

        .food-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .food-name {
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: capitalize;
            line-height: 1.3;
        }

        .qty-badge {
            background: #27272a;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            white-space: nowrap;
            margin-left: 10px;
        }

        /* Macro Pills */
        .macros-container {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 12px;
        }

        .macro-stat {
            text-align: center;
            flex: 1;
        }

        .macro-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .macro-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        .calories-big {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 24px;
        }
        
        .cal-label {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            margin-left: 4px;
        }

        /* Loading State */
        .loader {
            text-align: center;
            color: var(--text-muted);
            display: none;
        }

        /* Log Button */
        .log-btn {
            margin-top: 16px;
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .log-btn:hover { background: var(--accent); color: #000; }
        .log-btn.logged { background: var(--accent); color: #000; pointer-events: none; }

        /* History Section */
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 3rem 0 1rem;
        }

        .history-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        input[type="date"] {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            padding: 10px 16px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }
        input[type="date"]:focus { border-color: var(--accent); }

        .refresh-btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .refresh-btn:hover { border-color: var(--accent); }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .history-item-left { flex: 1; min-width: 160px; }
        .history-food-name { font-weight: 700; font-size: 1rem; text-transform: capitalize; }
        .history-date { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        .history-macros {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .h-macro {
            text-align: center;
        }
        .h-macro-val { font-weight: 700; font-size: 1rem; }
        .h-macro-lbl { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); }

        .delete-btn {
            background: transparent;
            border: 1px solid #3f3f46;
            color: var(--text-muted);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        .delete-btn:hover { border-color: #ef4444; color: #ef4444; }

        .history-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 2rem 0;
            font-size: 0.9rem;
        }

        .daily-totals {
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .total-stat { text-align: center; flex: 1; }
        .total-val { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
        .total-lbl { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <div class="search-wrapper">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Try &quot;1 cup rice and 200g chicken&quot;" 
                autocomplete="off"
            >
            <div class="enter-hint">PRESS ENTER</div>
        </div>

        <div id="loader" class="loader">Calculating macros...</div>

        <div id="resultsGrid" class="results-grid"></div>

        <!-- History Section -->
        <div id="historySection">
            <div class="section-title">Food Log History</div>

            <div class="history-controls">
                <input type="date" id="dateFilter" />
                <button class="refresh-btn" onclick="loadHistory()">Refresh</button>
                <button class="refresh-btn" onclick="document.getElementById('dateFilter').value=''; loadHistory()">Show All</button>
            </div>

            <div id="dailyTotals"></div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <script>
        // ── Configuration ──────────────────────────────────────────────────────
        const USDA_KEY = 'TXcRgtwFMvUFcQTdJPJHfLjXdbpLva940dKBh8ZD';
        const BACKEND  = 'http://localhost:5000';  // Your Python Flask server
        // ──────────────────────────────────────────────────────────────────────

        const searchInput = document.getElementById('searchInput');
        const resultsGrid = document.getElementById('resultsGrid');
        const loader      = document.getElementById('loader');

        // Set date filter to today by default
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateFilter').value = today;

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) fetchNutrition(query);
            }
        });

        // ── USDA FoodData Central Search ───────────────────────────────────────
        // Nutrient IDs used by the USDA API
        const NID = { calories: 1008, protein: 1003, fat: 1004, carbs: 1005 };

        function getNutrient(nutrients, id) {
            const match = nutrients.find(n => n.nutrientId === id);
            return match ? match.value : 0;
        }

        async function fetchNutrition(query) {
            resultsGrid.innerHTML = '';
            resultsGrid.classList.remove('visible');
            loader.style.display = 'block';

            try {
                const url = `https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(query)}&pageSize=10&api_key=${USDA_KEY}`;
                const response = await fetch(url);

                if (!response.ok) throw new Error('USDA API Request Failed');

                const data = await response.json();

                if (!data.foods || data.foods.length === 0) {
                    throw new Error('No results found for that query');
                }

                renderCards(data.foods);

            } catch (error) {
                console.error(error);
                resultsGrid.innerHTML = `<div style="color:#ef4444;text-align:center;">Error: ${error.message}</div>`;
                resultsGrid.classList.add('visible');
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderCards(foods) {
            resultsGrid.innerHTML = foods.map((food, i) => {
                const nutrients = food.foodNutrients || [];
                const calories  = Math.round(getNutrient(nutrients, NID.calories));
                const protein   = Math.round(getNutrient(nutrients, NID.protein));
                const carbs     = Math.round(getNutrient(nutrients, NID.carbs));
                const fat       = Math.round(getNutrient(nutrients, NID.fat));
                const name      = food.description || 'Unknown Food';
                const serving   = food.servingSize ? `${food.servingSize}${food.servingSizeUnit || 'g'}` : '100g';

                return `
                <div class="food-card">
                    <div class="food-header">
                        <span class="food-name">${name}</span>
                        <span class="qty-badge">${serving}</span>
                    </div>

                    <div class="calories-big">
                        ${calories}<span class="cal-label">kcal</span>
                    </div>

                    <div class="macros-container">
                        <div class="macro-stat">
                            <span class="macro-label">Protein</span>
                            <span class="macro-value">${protein}g</span>
                        </div>
                        <div class="macro-stat">
                            <span class="macro-label">Carbs</span>
                            <span class="macro-value">${carbs}g</span>
                        </div>
                        <div class="macro-stat">
                            <span class="macro-label">Fat</span>
                            <span class="macro-value">${fat}g</span>
                        </div>
                    </div>

                    <button
                        class="log-btn"
                        onclick="logFood(this)"
                        data-food='${JSON.stringify({
                            food_name:    name,
                            serving_qty:  food.servingSize || 100,
                            serving_unit: food.servingSizeUnit || 'g',
                            calories, protein, carbs, fat
                        }).replace(/'/g, "&apos;")}'>
                        + Log This Food
                    </button>
                </div>`;
            }).join('');

            setTimeout(() => resultsGrid.classList.add('visible'), 50);
        }

        // ── Log Food to Backend ────────────────────────────────────────────────
        async function logFood(btn) {
            const foodData = JSON.parse(btn.dataset.food.replace(/&apos;/g, "'"));

            try {
                const res = await fetch(`${BACKEND}/log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(foodData)
                });

                if (!res.ok) throw new Error('Failed to log food');

                btn.textContent = '✓ Logged';
                btn.classList.add('logged');

                // Reload history so the new entry appears
                loadHistory();

            } catch (err) {
                alert('Could not save: ' + err.message + '\nMake sure server.py is running.');
            }
        }

        // ── Load History from Backend ──────────────────────────────────────────
        async function loadHistory() {
            const dateFilter  = document.getElementById('dateFilter').value;
            const historyList = document.getElementById('historyList');
            const totalsEl    = document.getElementById('dailyTotals');

            historyList.innerHTML = '<div class="history-empty">Loading…</div>';
            totalsEl.innerHTML    = '';

            try {
                const url = dateFilter
                    ? `${BACKEND}/history?date=${dateFilter}`
                    : `${BACKEND}/history`;

                const res  = await fetch(url);
                const rows = await res.json();

                if (!Array.isArray(rows) || rows.length === 0) {
                    historyList.innerHTML = '<div class="history-empty">No entries found.</div>';
                    return;
                }

                // Daily totals banner
                const totals = rows.reduce((acc, r) => {
                    acc.cal  += r.calories || 0;
                    acc.pro  += r.protein  || 0;
                    acc.carb += r.carbs    || 0;
                    acc.fat  += r.fat      || 0;
                    return acc;
                }, { cal: 0, pro: 0, carb: 0, fat: 0 });

                totalsEl.innerHTML = `
                    <div class="daily-totals">
                        <div class="total-stat">
                            <div class="total-val">${Math.round(totals.cal)}</div>
                            <div class="total-lbl">Calories</div>
                        </div>
                        <div class="total-stat">
                            <div class="total-val">${Math.round(totals.pro)}g</div>
                            <div class="total-lbl">Protein</div>
                        </div>
                        <div class="total-stat">
                            <div class="total-val">${Math.round(totals.carb)}g</div>
                            <div class="total-lbl">Carbs</div>
                        </div>
                        <div class="total-stat">
                            <div class="total-val">${Math.round(totals.fat)}g</div>
                            <div class="total-lbl">Fat</div>
                        </div>
                    </div>
                `;

                historyList.innerHTML = rows.map(row => `
                    <div class="history-item" id="hist-${row.id}">
                        <div class="history-item-left">
                            <div class="history-food-name">${row.food_name}</div>
                            <div class="history-date">${new Date(row.logged_at).toLocaleString()}</div>
                        </div>
                        <div class="history-macros">
                            <div class="h-macro">
                                <div class="h-macro-val">${Math.round(row.calories)}</div>
                                <div class="h-macro-lbl">kcal</div>
                            </div>
                            <div class="h-macro">
                                <div class="h-macro-val">${Math.round(row.protein)}g</div>
                                <div class="h-macro-lbl">Protein</div>
                            </div>
                            <div class="h-macro">
                                <div class="h-macro-val">${Math.round(row.carbs)}g</div>
                                <div class="h-macro-lbl">Carbs</div>
                            </div>
                            <div class="h-macro">
                                <div class="h-macro-val">${Math.round(row.fat)}g</div>
                                <div class="h-macro-lbl">Fat</div>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteEntry(${row.id})">Delete</button>
                    </div>
                `).join('');

            } catch (err) {
                historyList.innerHTML = `<div class="history-empty" style="color:#ef4444;">Cannot reach backend. Start server.py first.</div>`;
            }
        }

        // ── Delete Entry ───────────────────────────────────────────────────────
        async function deleteEntry(id) {
            if (!confirm('Remove this entry?')) return;
            try {
                const res = await fetch(`${BACKEND}/log/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Delete failed');
                document.getElementById(`hist-${id}`)?.remove();
                loadHistory(); // refresh totals
            } catch (err) {
                alert('Could not delete: ' + err.message);
            }
        }

        // Load history on page open
        loadHistory();
    </script>
</body>
</html>
